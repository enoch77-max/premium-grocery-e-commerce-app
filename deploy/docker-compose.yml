# Fresco — single-VPS production stack.
#   cd deploy && docker compose --env-file ../.env up -d --build
name: fresco

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: fresco
      POSTGRES_USER: fresco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No published ports: the database is reachable only on the compose network.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fresco -d fresco"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3000"
      DATABASE_URL: postgresql://fresco:${POSTGRES_PASSWORD}@postgres:5432/fresco
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      ADMIN_NAME: ${ADMIN_NAME:-Store Owner}
      SEED_DEMO_DATA: ${SEED_DEMO_DATA:-1}
      TRUST_PROXY: "1"
    expose: ["3000"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:3000/api/health || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 45s
      retries: 5
    networks: [internal]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [internal]

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_PASSPHRASE: ${BACKUP_PASSPHRASE}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    volumes:
      - ./backup.sh:/usr/local/bin/backup.sh:ro
      - backups:/var/backups/fresco
    entrypoint: ["/bin/sh", "-c"]
    command: ["crond -f -l 2 & sleep 2; echo '0 3 * * * /bin/sh /usr/local/bin/backup.sh >> /var/backups/fresco/backup.log 2>&1' > /var/spool/cron/crontabs/root; crond -f -l 2"]
    networks: [internal]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backups:

networks:
  internal:
    driver: bridge
